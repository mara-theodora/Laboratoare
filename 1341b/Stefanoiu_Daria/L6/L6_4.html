<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<title>
Modificare folosind clase
</title>
</head>
<body>
<h3>Utilizati Javascript si HTML DOM pentru a inlocui imaginile de mai jos asa cum este indicat in textele de deasupra lor</h3>

Pisici
<hr />
<img class="animal" src="Img/Pesti.jpg" alt="Niste pesti" width="160" height="120">
<br /> <br />
Munti
<hr />
<img class="peisaj" src="Img/desert.jpg" alt="O jungla" width="160" height="120">
<br /> <br />
Caini
<hr />
<img class="animal" src="Img/egrete.jpg" alt="Niste egrete" width="160" height="120">
<br /> <br />
Mare
<hr />
<img class="peisaj" src="Img/jungla.jpg" alt="Un desert" width="160" height="120">

<script>
    // Folosim getElementsByClassName pentru a schimba imaginile la încărcare
    const animale = document.getElementsByClassName('animal');
    const peisaje = document.getElementsByClassName('peisaj');

    // Prima imagine de tip animal (Pisici) și a doua (Caini)
    if (animale.length >= 2) {
        animale[0].src = "Img/pisici.jpg";
        animale[1].src = "Img/caini.jpg";
    }

    // Primul peisaj (Munti) și al doilea (Mare)
    if (peisaje.length >= 2) {
        peisaje[0].src = "Img/munti.jpg";
        peisaje[1].src = "Img/mare.jpg";
    }
</script>

</body>
</html>

</body>
</html>
