<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Exercitiu Bonus - Contor</title>
    <script>
        var contor = 0;

        function schimbaBec() {
            var bec = document.getElementById('bec');
            var mesaj = document.getElementById('mesaj');

            if (bec.src.match("stins")) {
                bec.src = "Bec aprins.gif";
                contor++;
                mesaj.innerHTML = "Becul a fost aprins de " + contor + " ori.";
            } else {
                bec.src = "Bec stins.gif";
            }
        }
    </script>
</head>
<body>
    <h1>Bec cu contor</h1>
    
    <img id="bec" src="Bec stins.gif" onclick="schimbaBec()" alt="Bec" width="100" height="180" style="cursor: pointer;">
    
    <p id="mesaj">Becul a fost aprins de 0 ori.</p>
</body>
</html>
