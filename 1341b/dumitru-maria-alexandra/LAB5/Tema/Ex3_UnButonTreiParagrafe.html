<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Exercitiul 4 - Un Buton si Trei Paragrafe</title>
    
    <script>
        function modificaParagrafe() {
            var p1 = document.getElementById("paragraf1");
            p1.innerHTML = "Acesta este paragraful 1";
            p1.style.color = "white";
            p1.style.backgroundColor = "blue";

            var p2 = document.getElementById("paragraf2");
            p2.innerHTML = "Acesta este paragraful 2";
            p2.style.color = "black";
            p2.style.backgroundColor = "yellow";

            var p3 = document.getElementById("paragraf3");
            p3.innerHTML = "Acesta este paragraful 3";
            p3.style.color = "white";
            p3.style.backgroundColor = "purple";
        }
    </script>
</head>
<body>

    <h1>Modificare paragrafe prin functie</h1>

    <p id="paragraf1">Text initial pentru primul paragraf.</p>
    <p id="paragraf2">Text initial pentru al doilea paragraf.</p>
    <p id="paragraf3">Text initial pentru al treilea paragraf.</p>

    <button type="button" onclick="modificaParagrafe()">Aplică Modificările</button>

</body>
</html>
