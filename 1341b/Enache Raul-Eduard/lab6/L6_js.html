
<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Document creat cu JavaScript</title>
</head>
<body>
    <script>
        var titlu = document.createElement("h1");
        titlu.innerHTML = "Header mare";
        titlu.style.color = "blue";
        document.body.appendChild(titlu);

        var p = document.createElement("p");
        p.innerHTML = "Paragraf<br>cu trei<br>linii.";
        p.style.backgroundColor = "yellow";
        p.style.width = "200px";
        document.body.appendChild(p);
	</script>
</body>
</html>
