<!DOCTYPE html>
<html>
<head>
    <title></title>
</head>
<body>
    <p id="par">
        Text initial;
    </p>
    <script>
        var text = prompt("Introduceți noul text al paragrafului:", "Text initial");
        if (text !== null && text !== "") {
            document.getElementById("par").innerHTML = text;
        }
    </script>

</body>
</html>
