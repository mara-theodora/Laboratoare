<!DOCTYPE html>
<html>
  <head>
    <title>Modificare folosind clase</title>
  </head>
  <body>
    <h1>
      Utilizati Javascript si HTML DOM (metoda getElementsByClassName() ) pentru
      a modifica culorile as acum se indica mai jos
    </h1>
    <div class="yb">
      <br />
      <p class="by">
        Text <br />
        albastru <br />
        pe fond <br />galben
      </p>
      <br />
      <p class="yb">
        Text <br />
        galben <br />
        pe fond <br />albastru
      </p>
      <br />
    </div>

    <div class="by">
      <br />
      <p class="by">
        Alt text <br />
        albastru <br />
        pe fond <br />galben
      </p>
      <br />
      <p class="yb">
        Alt text <br />
        galben <br />
        pe fond <br />albastru
      </p>
      <br />
    </div>
    <script>
      // 1. Elementele cu clasa "by" (albastru pe fond galben)
      var elementeBY = document.getElementsByClassName("by");
      for (var i = 0; i < elementeBY.length; i++) {
        elementeBY[i].style.color = "blue";
        elementeBY[i].style.backgroundColor = "yellow";
      }

      // 2. Elementele cu clasa "yb" (galben pe fond albastru)
      var elementeYB = document.getElementsByClassName("yb");
      for (var j = 0; j < elementeYB.length; j++) {
        elementeYB[j].style.color = "yellow";
        elementeYB[j].style.backgroundColor = "blue";
      }
    </script>
  </body>
</html>
