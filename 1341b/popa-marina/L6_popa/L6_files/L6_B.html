<!DOCTYPE html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <title>L6_B</title>
    <style>
      #p1 {
        color: darkblue;
        font-size: 18px;
        cursor: pointer;
        padding: 8px;
        border: 1px solid #ccc;
        margin-bottom: 8px;
        min-height: 24px; /* Menține căsuța vizibilă chiar dacă textul e șters */
      }
      #p2 {
        color: darkgreen;
        font-style: italic;
        cursor: pointer;
        padding: 8px;
        border: 1px solid #ccc;
        margin-bottom: 8px;
        min-height: 24px;
      }
      button {
        padding: 8px 14px;
        margin-bottom: 15px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <button id="btnSwap">Interschimbă paragrafele</button>

    <p id="p1">Primul paragraf (albastru).</p>
    <p id="p2">Al doilea paragraf (verde).</p>

    <script>
      var primul = document.getElementById("p1");
      var alDoilea = document.getElementById("p2");
      var buton = document.getElementById("btnSwap");

      // Funcție reutilizabilă pentru editarea oricărui paragraf
      function schimbaText() {
        var textNou = prompt("Introduceți noul text:", this.textContent);

        // Dacă utilizatorul nu a apăsat "Cancel" (textNou nu este null), actualizăm textul
        if (textNou !== null) {
          this.textContent = textNou;
        }
      }

      // Atribuim evenimentul de clic pe ambele paragrafe
      primul.onclick = schimbaText;
      alDoilea.onclick = schimbaText;

      // Interschimbarea conținuturilor la apăsarea butonului
      buton.onclick = function () {
        var aux = primul.textContent;
        primul.textContent = alDoilea.textContent;
        alDoilea.textContent = aux;
      };
    </script>
  </body>
</html>
