<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Exercițiul 6 - Contor Bec</title>
    <script>
        let numarAprinderi = 0;

        function comutaBec() {
            let bec = document.getElementById("beculmeu");
            let contorText = document.getElementById("textContor");

            console.log(bec.src);

            if (bec.src.includes("stins")) {
                bec.src = "Bec aprins.gif";
                numarAprinderi++;
                contorText.innerHTML = "Becul a fost aprins de " + numarAprinderi + " ori.";
            } else {
                bec.src = "Bec stins.gif";
            }
        }
    </script>
</head>
<body>

    <h1>Becul interactiv cu contor</h1>

    <p>
        <img id="beculmeu" src="Bec stins.gif" alt="Bec" onclick="comutaBec()" style="cursor: pointer;">
    </p>
    
    <p id="textContor">Becul a fost aprins de 0 ori.</p>

</body>
</html>
