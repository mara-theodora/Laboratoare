<!DOCTYPE html>
<html>
<head>
<title>Modificari cu JavaScript in tag</title>

</head>
<body>

<h1>Modificari paragraf la click pe buton</h1>

<p id="unParagraf">Acesta este un paragraf de modificat.</p>

<button onclick="document.getElementById('unParagraf').style.backgroundColor = 'pink'; document.getElementById('unParagraf').style.color = 'red';">
    Schimbă culoarea
</button>


</body>
</html>
