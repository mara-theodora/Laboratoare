<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Document creat cu JavaScript</title>
</head>
<body>
    <script>
        var h1 = document.createElement("h1");
        h1.innerHTML = "Header mare";
        h1.style.color = "blue";
        
        document.body.appendChild(h1);

        var p1 = document.createElement("p");
        p1.innerHTML = "Paragraf<br>cu trei<br>linii.";
        p1.style.backgroundColor = "yellow";
        
        document.body.appendChild(p1);
    </script>
</body>
</html>
