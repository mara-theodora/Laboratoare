<!DOCTYPE html>
<html>
<head>
<title>Modificari cu JavaScript in tag</title>

</head>
<body>

<h1>Modificari paragraf la click pe buton</h1>

 <p id="p1">Paragraf de modificat</p>

<button 
 onclick="document.getElementById('p1').style.backgroundColor = 'rgb(0, 255, 200)'; document.getElementById('p1').style.color = 'rgb(255, 0, 119)';"

>Click!</button>

</body>
</html>
