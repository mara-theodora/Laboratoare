<!DOCTYPE html>
<html>
<head>
<title>
Modificare folosind clase
</title>
</head>
<body>
<h1> Utilizati Javascript si HTML DOM (metoda getElementsByClassName() ) pentru a modifica culorile as acum se indica mai jos </h1>
<div class="yb">
<br />
<p class='by'>Text <br /> albastru <br /> pe fond <br />galben</p>
<br />
<p class="yb">Text <br /> galben <br /> pe fond <br />albastru</p>
<br />
</div>

<div class="by">
<br />
<p class='by'>Alt text <br /> albastru <br /> pe fond <br />galben</p>
<br />
<p class='yb'>Alt text <br /> galben <br /> pe fond <br />albastru</p>
<br />
</div>
<script>
const elementeBy = document.getElementsByClassName('by');
for (let i = 0; i < elementeBy.length; i++) {
    elementeBy[i].style.color = 'blue';
    elementeBy[i].style.backgroundColor = 'yellow';
}

const elementeYb = document.getElementsByClassName('yb');
for (let i = 0; i < elementeYb.length; i++) {
    elementeYb[i].style.color = 'yellow';
    elementeYb[i].style.backgroundColor = 'blue';
}
</script>

</body>
</html>
