
<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Document creat cu JavaScript</title>
</head>
<body>
    <script>
    var titlu = document.createElement("h1");
    titlu.textContent = "Acesta este un titlu generat din JavaScript";
    titlu.style.color = "blue";
    document.body.appendChild(titlu);

    var paragraf = document.createElement("p");
    paragraf.id = "paragraf-special";
    paragraf.style.backgroundColor = "yellow";
    paragraf.innerHTML = "Aceasta este prima linie a paragrafului.<br>" +
                         "Aceasta este a doua linie a paragrafului.<br>" +
                         "Aceasta este a treia linie a paragrafului.";
    document.body.appendChild(paragraf);
</script>
</body>
</html>
