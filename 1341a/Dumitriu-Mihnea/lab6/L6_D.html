<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Galerie Foto</title>
</head>
<body>
    <img id="imagineCurenta" src="Img/pisici.jpg" alt="Galerie" width="300" height="200"><br>
    <button id="btnInapoi">Înapoi</button>
    <button id="btnInainte">Înainte</button>
    <p id="textInfo">Imaginea 1 din 4</p>

    <script>
        let imagini = ["Img/pisici.jpg", "Img/caini.jpg", "Img/munti.jpg", "Img/mare.jpg"];
        let index = 0;

        let imgElement = document.getElementById("imagineCurenta");
        let textInfo = document.getElementById("textInfo");

        function actualizeazaGalerie() {
            imgElement.src = imagini[index];
            textInfo.textContent = "Imaginea " + (index + 1) + " din 4";
        }

        document.getElementById("btnInainte").onclick = function() {
            index = (index + 1) % imagini.length;
            actualizeazaGalerie();
        };

        document.getElementById("btnInapoi").onclick = function() {
            index = (index - 1 + imagini.length) % imagini.length;
            actualizeazaGalerie();
        };
    </script>
</body>
</html>
