<!DOCTYPE html>
<html>
<head>
<title>
Acest titlu va fi modificat cu JS
</title>
</head>
<body>

<p>Salutare, <br> oameni buni! <br> (De modificat culoarea de background cu js!)</p>

<p>Folositi metoda <b>getElementsByTagName</b> pentru a modifica culorile indicate in paragrafele alaturate, <br> precum si titlul paginii !</p>

<p>Acest text va fi colorat <br>folosind <br> JavaScript</p>

<script>
var par=document.getElementsByTagName("p")

par[0].style.backgroundColor="red"

par[2].style.color="blue"
</script>

</body>
</html>
