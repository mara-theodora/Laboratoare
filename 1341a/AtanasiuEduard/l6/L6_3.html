<!DOCTYPE html>
<html>
<head>
<title>
Modificare folosind clase
</title>
</head>
<body>
<h1> Utilizati Javascript si HTML DOM (metoda getElementsByClassName() ) pentru a modifica culorile as acum se indica mai jos </h1>
<div class="yb">
<br />
<p class='by'>Text <br /> albastru <br /> pe fond <br />galben</p>
<br />
<p class="yb">Text <br /> galben <br /> pe fond <br />albastru</p>
<br />
</div>

<div class="by">
<br />
<p class='by'>Alt text <br /> albastru <br /> pe fond <br />galben</p>
<br />
<p class='yb'>Alt text <br /> galben <br /> pe fond <br />albastru</p>
<br />
</div>
<script>
// Utilizati getElementsByClassName() si element.style.color/backgroundColor pentru a modifica culorile paragrafelor asa cum se specifica!
var c_yb = document.getElementsByClassName("yb")
for (var i=0;i<c_yb.length;i++){
    c_yb[i].style.color="yellow"
    c_yb[i].style.backgroundColor="blue"
}

var c_by = document.getElementsByClassName("by")
for (var i=0;i<c_by.length;i++){
    c_by[i].style.color="blue"
    c_by[i].style.backgroundColor="yellow"
}
</script>

</body>
</html>
