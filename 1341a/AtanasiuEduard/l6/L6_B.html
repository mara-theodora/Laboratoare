<!DOCTYPE html>
<html>
<head>
<title>L6_B</title>
<script>
function myFunction(){
    var x = document.getElementById("p1")

    var y = document.getElementById("p2")

    var aux = x.innerHTML
    x.innerHTML=y.innerHTML
    y.innerHTML=aux

}
function modifica(id){
    var text=prompt("Introduceti textul nou:");
    if (text !== null && text !== ""){
        document.getElementById(id).innerHTML=text;
    }
}
</script>
</head>
<body>

<button id="butt" type="button" onclick="myFunction()">Apasa-ma!</button>

<p id="p1" onclick="modifica('p1')">Acesta este un paragraf</p>

<p id="p2" onclick="modifica('p2')">Si acesta este un paragraf</p>


</body>
</html>
