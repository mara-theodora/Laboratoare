
<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Document creat cu JavaScript</title>
</head>
<body>
    <script>
	var h=document.createElement("h1")

    h.innerHTML="Header mare"
    h.style.color="blue"
    h.style.fontSize="48 px"

    document.body.appendChild(h)

    var p=document.createElement("p")

    p.innerHTML="Paragraf<br> cu trei<br> linii."
    p.style.backgroundColor="yellow"
    p.style.fontSize="24 px"

    document.body.appendChild(p)

	</script>
</body>
</html>
