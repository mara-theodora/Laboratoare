<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Document creat cu JavaScript</title>
</head>
<body>
    <script>
        // 1. Crearea titlului mare (h1), albastru
        var titlu = document.createElement("h1");
        titlu.innerHTML = "Header mare";
        titlu.style.color = "blue";
        document.body.appendChild(titlu);

        // 2. Crearea paragrafului pe trei linii, cu fundal galben
        var par = document.createElement("p");
        par.innerHTML = "Paragraf<br>cu trei<br>linii.";
        par.style.backgroundColor = "yellow";
        document.body.appendChild(par);
    </script>
</body>
</html>
