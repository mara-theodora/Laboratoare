<!DOCTYPE html>
<html>
<body>
<h1 id="titlu">Titlu de cateva cuvinte</h1>
<p id="paragraf">Linia 1<br>Linia 2<br>Linia 3</p>

<script>
document.getElementById("titlu").onclick = function() {
    var c = prompt("Introduceti culoarea pentru titlu:");
    if (c !== null) {
        if (CSS.supports("color", c)) {
            this.style.color = c;
        } else {
            alert("Culoare incorecta!");
        }
    }
};

document.getElementById("paragraf").onclick = function() {
    var c = prompt("Introduceti culoarea de fundal pentru paragraf:");
    if (c !== null) {
        if (CSS.supports("color", c)) {
            this.style.backgroundColor = c;
        } else {
            alert("Culoare incorecta!");
        }
    }
};
</script>
</body>
</html>
