<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Document creat cu JavaScript</title>
</head>
<body>
    <script>
	var h1 = document.createElement("h1");
    h1.innerHTML = "Header mare";
    h1.style.color = "blue";
    document.body.appendChild(h1);

    var p = document.createElement("p");
    p.innerHTML = "Paragraf<br>cu trei<br>linii.";
    p.style.backgroundColor = "yellow";
    document.body.appendChild(p);
	</script>
</body>
</html>
