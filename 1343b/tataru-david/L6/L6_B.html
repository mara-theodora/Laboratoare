<!DOCTYPE html>
<html>
<body>
<button onclick="schimbaTexte()">Schimba textele intre ele</button>
<p id="p1" style="background-color: lightgray;" onclick="cereText(this)">Paragraful 1</p>
<p id="p2" style="background-color: lightblue;" onclick="cereText(this)">Paragraful 2</p>

<script>
function cereText(element) {
    var textNou = prompt("Introduceti textul nou:", element.innerHTML);
    if (textNou !== null && textNou !== "") {
        element.innerHTML = textNou;
    }
}

function schimbaTexte() {
    var p1 = document.getElementById("p1");
    var p2 = document.getElementById("p2");
    var aux = p1.innerHTML;
    p1.innerHTML = p2.innerHTML;
    p2.innerHTML = aux;
}
</script>
</body>
</html>
