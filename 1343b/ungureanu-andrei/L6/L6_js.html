<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Document creat cu JavaScript</title>
</head>
<body>
    <script>
        let titlu = document.createElement("h1");
        titlu.innerHTML = "TITLU";
        titlu.style.color = "blue";
        titlu.style.fontSize = "40px";
        document.body.appendChild(titlu);

        let paragraf = document.createElement("p");
        paragraf.innerHTML = "Prima linie<br>A doua linie<br>A treia linie";
        paragraf.style.backgroundColor = "yellow";
        document.body.appendChild(paragraf);
    </script>
</body>
</html>
