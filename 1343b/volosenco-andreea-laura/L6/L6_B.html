<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title>Laboratorul 6_B</title>
</head>
<html>
<body>

<button type="button" id="butt" onclick="interschimbare()">Apasa-ma</button>
<p id="p1" onclick="schimbare1()">Primul paragraf.</p>
<p id="p2">Al doilea paragraf.</p>

<script>
// Utilizati getElementById() !
par1 = document.getElementById("p1");
par2 = document.getElementById("p2");

function schimbare1(){
    var text = prompt("Introduceți noul text al paragrafului:", "text initial");
    if (text !== null && text !== "")
        par1.innerHTML = text;
}

function interschimbare() {
    var aux = par1.innerHTML;
    par1.innerHTML = par2.innerHTML;
    par2.innerHTML = aux;
}

</script>

</body>
</html>
