<!DOCTYPE html>
<html>
<head>
<title>
Modificare folosind clase si evenimente
</title>
</head>
<body>
<h3> Utilizati Javascript si HTML DOM pentru a inlocui imaginile de mai jos asa cum este indicat in textele de deasupra lor</h1>
La click vor aparea Pisici
<hr />
<img class="animal" src="pesti.jpg" alt="Niste pesti" width="160" height="120" onclick="cats()">
<br /> <br />
La mouseover vor aparea Munti
<hr />
<img class="peisaj" src="desert.jpg" alt="O jungla" width="160" height="120" onmouseover="mountain()">
<br /> <br />
La click vor aparea Caini
<hr />
<img class="animal" src="egrete.jpg" alt="Niste egrete" width="160" height="120" onclick="dogs()">
<br /> <br />
la mouseout va aparea o Mare
<hr />
<img class="peisaj" src="jungla.jpg" alt="Un desert" width="160" height="120" onmouseout="sea()">

<script>
// Utilizati getElementsByClassName() pentru a modifica imaginile pentru a se potrivi cu textele de deasupra lor la aparitia evenimentelor indicate!

var animal = document.getElementsByClassName("animal");
var peisaj = document.getElementsByClassName("peisaj");

function cats() {
    animal[0].src = "Img/pisici.jpg";
}
function dogs() {
    animal[1].src = "Img/caini.jpg";
}
function mountain() {
    peisaj[0].src = "Img/munti.jpg";
}
function sea() {
    peisaj[1].src = "Img/mare.jpg"
}

</script>
</body>
</html>
