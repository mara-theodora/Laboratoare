
<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Document creat cu JavaScript</title>
</head>
<body>
        <script>

        var h = document.createElement("h1");
        h.textContent = "Titlu creat cu JavaScript";
        h.style.color = "blue";
        h.style.fontSize = "40px";
        document.body.appendChild(h);

        var p = document.createElement("p");
        p.innerHTML = "Prima linie<br>A doua linie<br>A treia linie";
        p.style.backgroundColor = "yellow";
        document.body.appendChild(p);

    </script>
</body>
</html>
