<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Laborator 6 - Exercițiul Galerie</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
            background-color: #8fb1e4;
        }

        .galerie-container {
            display: inline-block;
            background-color: #3b7be0;
            border: 1px solid #4a84ca;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
        }

        #imagine-curenta {
            display: block;
            margin: 0 auto 18px auto;
            width: 380px;
            height: 280px;
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid #e2e8f0;
        }

        .controale button {
            padding: 10px 22px;
            font-size: 15px;
            font-weight: 600;
            margin: 0 8px;
            cursor: pointer;
            color: #ffffff;
            background-color: #2563eb;
            border: none;
            border-radius: 6px;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .controale button:hover {
            background-color: #1d4ed8;
        }

        .controale button:active {
            transform: scale(0.97);
        }

        #contor {
            margin-top: 18px;
            font-weight: 600;
            font-size: 15px;
            color: #f3f4f5;
        }
    </style>
</head>
<body>

    <div class="galerie-container">
        <img id="imagine-curenta" src="" alt="Imagine galerie">

        <div class="controale">
            <button id="btn-inapoi">Înapoi</button>
            <button id="btn-inainte">Înainte</button>
        </div>

        <p id="contor"></p>
    </div>

    <script>
        var imagini = [
            "Img/caini.jpg",
            "Img/mare.jpg",
            "Img/munti.jpg",
            "Img/pisici.jpg"
        ];

        var index = 0;

        var imgElem = document.getElementById("imagine-curenta");
        var contorElem = document.getElementById("contor");
        var btnInapoi = document.getElementById("btn-inapoi");
        var btnInainte = document.getElementById("btn-inainte");

        function actualizeazaGalerie() {
            imgElem.src = imagini[index];
            imgElem.alt = "Imaginea " + (index + 1);
            contorElem.innerText = "Imaginea " + (index + 1) + " din " + imagini.length;
        }

        btnInainte.addEventListener("click", function() {
            index = (index + 1) % imagini.length;
            actualizeazaGalerie();
        });

        btnInapoi.addEventListener("click", function() {
            index = (index - 1 + imagini.length) % imagini.length;
            actualizeazaGalerie();
        });

        actualizeazaGalerie();
    </script>

</body>
</html>
