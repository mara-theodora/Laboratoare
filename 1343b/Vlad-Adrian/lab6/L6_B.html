<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>L6_B</title>
</head>
<body>

    <button id="btn">Schimbă conținutul</button>

    <p id="p1" style="color: blue; font-weight: bold;">Acesta este primul paragraf.</p>
    <p id="p2" style="color: green; font-style: italic;">Acesta este al doilea paragraf.</p>

    <script>
        var p1 = document.getElementById("p1");
        var p2 = document.getElementById("p2");
        var btn = document.getElementById("btn");

        p1.onclick = function() {
            var text = prompt("Introduceți un text nou:", this.innerHTML);
            if (text !== null && text !== "") {
                this.innerHTML = text;
            }
        };

        p2.onclick = function() {
            var text = prompt("Introduceți un text nou:", this.innerHTML);
            if (text !== null && text !== "") {
                this.innerHTML = text;
            }
        };

        btn.onclick = function() {
            var temp = p1.innerHTML;
            p1.innerHTML = p2.innerHTML;
            p2.innerHTML = temp;
        };
    </script>

</body>
</html>
