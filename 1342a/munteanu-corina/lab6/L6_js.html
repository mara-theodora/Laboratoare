<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Document creat cu JavaScript</title>
</head>

<body>

    <script>
      
        var titlu = document.createElement("h1");

        titlu.textContent = "Pagina creata cu JavaScript";

        titlu.style.color = "blue";
        titlu.style.fontSize = "40px";

        document.body.appendChild(titlu);


        var paragraf = document.createElement("p");

        paragraf.innerHTML =
            "Acesta este primul rand de text.<br>" +
            "Acesta este al doilea rand de text.<br>" +
            "Acesta este al treilea rand de text.";

        paragraf.style.backgroundColor = "yellow";
        paragraf.style.padding = "20px";
        paragraf.style.fontSize = "18px";

        document.body.appendChild(paragraf);
    </script>

</body>
</html>
