
<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Document creat cu JavaScript</title>
</head>
<body>
    <button type="button" onclick="schimbare()">buton</button>
<p id="p1" onclick="change()">Deasupra mea este un buton.</p>
<p id="p2">Deasupra mea este un alt paragraf.</p>
    <script>
        par1=document.getElementById("p1");
        par2=document.getElementById("p2");
        function change(){
	var text = prompt("Introduceți noul text al paragrafului:", "Text initial");
if (text !== null && text !== "") 
 document.getElementById("p1").innerHTML = text;

        }
        function schimbare(){
            var aux=par1.innerHTML;
            par1.innerHTML=par2.innerHTML;
            par2.innerHTML=aux;
        }
	</script>
</body>
</html>
