<!DOCTYPE html>
<html>

        <title>

        </title>

<body>
    <h3>
        Utilizati Javascript si HTML DOM pentru a inlocui imaginile de mai jos asa cum este indicat in textele de deasupra lor</h3>
        Pisici
        <hr />
        <img class="animal" src="pesti.jpg" alt="Niste pesti" width="160" height="120">

        <br /> <br />
        Munti
        <hr />
        <img class="peisaj" src="desert.jpg" alt="O jungla" width="160" height="120">

        <br /> <br />
        Caini
        <hr />
        <img class="animal" src="egrete.jpg" alt="Niste egrete" width="160" height="120">

        <script>
            
        </script>
        <br /> <br />
        Mare
        <hr />
        <img class="mare" src="jungla.jpg" alt="Un desert" width="160" height="120">

        <script>
            // Utilizati getElementsByClassName() pentru a modifica imaginile pentru a se potrivi cu textele de deasupra lor!
            var animalImages = document.getElementsByClassName("animal");
            animalImages[0].src = "Img/pisici.jpg";
            animalImages[0].alt = "Niste pisici";

            var peisajImages = document.getElementsByClassName("peisaj");
            peisajImages[0].src = "Img/munti.jpg";
            peisajImages[0].alt = "Niste munti";

            var cainiImages = document.getElementsByClassName("animal");
            cainiImages[1].src = "Img/caini.jpg";
            cainiImages[1].alt = "Nisti caini";

            var mareImages = document.getElementsByClassName("mare");
            mareImages[0].src = "Img/mare.jpg";
            mareImages[0].alt = "O mare";
         </script>

</body>
</html>
