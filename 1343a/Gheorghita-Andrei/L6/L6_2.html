<!DOCTYPE html>
<html>
<head>
<title>
Acest titlu va fi modificat cu JS
</title>
</head>
<body>

<p id="p1">Salutare, <br /> oameni buni! <br /> (De modificat culoarea de background cu js!)</p>

<p>Folositi metoda <b>getElementsByTagName</b> pentru a modifica culorile indicate in paragrafele alaturate, <br /> precum si titlul paginii !</p>

<p id="p3">Acest text va fi colorat <br/>folosind <br /> JavaScript</p>

<script>
// Utilizati getElementsByTagName() si element.style.color/backgroundColor, precum si document.title!
    var p1 = document.getElementsByTagName("p")[0];
    p1.style.backgroundColor = "yellow";
    p1.style.color = "blue";
    
    var p3 = document.getElementsByTagName("p")[2];
    p3.style.backgroundColor = "lightgray";
    p3.style.color = "black";

    document.title.style.color = "green";

</script>

</body>
</html>
