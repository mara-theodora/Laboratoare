</head>
<body>

        <h1 id="h1">Titlu sectiunii</h1>

        <script>
            var culoare = prompt("Introduceți o noua culoare pentru titlu:");
            if (culoare != null && culoare != "") {

            } else {
                alert("Culoarea introdusă nu este validă. Vă rugăm să introduceți o culoare validă.");
            }
            }
        </script>

        <p id="p">

        </p>

</body>
