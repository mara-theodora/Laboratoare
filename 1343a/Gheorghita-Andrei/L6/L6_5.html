<!DOCTYPE html>
<html>
    <head>
        <title>
        Modificare folosind clase si evenimente
        </title>
    </head>

    <body>
        <h3> Utilizati Javascript si HTML DOM pentru a inlocui imaginile de mai jos asa cum este indicat in textele de deasupra lor</h3>
        La click vor aparea Pisici
        <hr />
        <img class="animal" src="pesti.jpg" alt="Niste pesti" width="160" height="120">
        <br /> <br />

        La mouseover vor aparea Munti
        <hr />
        <img class="peisaj" src="desert.jpg" alt="O jungla" width="160" height="120">
        <br /> <br />

        La click vor aparea Caini
        <hr />
        <img class="animal" src="egrete.jpg" alt="Niste egrete" width="160" height="120">
        <br /> <br />

        la mouseout va aparea o Mare
        <hr />
        <img class="peisaj" src="jungla.jpg" alt="Un desert" width="160" height="120">

    <script>
    // Utilizati getElementsByClassName() pentru a modifica imaginile pentru a se potrivi cu textele de deasupra lor la aparitia evenimentelor indicate!
        var animalImages = document.getElementsByClassName("animal");
        animalImages[0].addEventListener("click", function() {
            this.src = "Img/pisici.jpg";
            this.alt = "Niste pisici";
        });
        var peisajImages = document.getElementsByClassName("peisaj");
        peisajImages[0].addEventListener("mouseover", function() {
            this.src = "Img/munti.jpg";
            this.alt = "Niste munti";
        });
        var cainiImages = document.getElementsByClassName("animal");
        cainiImages[1].addEventListener("click", function() {
            this.src = "Img/caini.jpg";
            this.alt = "Nisti caini";
        });
        var mareImages = document.getElementsByClassName("peisaj");
        mareImages[1].addEventListener("mouseout", function() {
            this.src = "Img/mare.jpg";
            this.alt = "O mare";
        });
    </script>

    </body>
</html>
