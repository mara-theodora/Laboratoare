<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title> Exercițiu modificare paragraf </title>
</head>
<body>

<h1> Modificări paragraf la mouseover/mouseout</h1>

<p style="background-color:yellow; color:blue"
   onmouseover="this.style.backgroundColor = 'blue'; this.style.color = 'yellow';"
   onmouseout="this.style.backgroundColor = 'yellow'; this.style.color = 'blue';">
   Paragraf de modificat</p>
<br><br>
<a href="index.html"><button type="button">Înapoi la exerciții</button></a>

</body>
</html>
