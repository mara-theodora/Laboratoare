<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Modificari cu JavaScript in tag</title>
</head>
<body>

<h1>Modificări paragraf la click pe buton</h1>

<p id="p1">Paragraf de modificat</p>

<button type="button" onclick="var x = document.getElementById('p1');
    x.style.backgroundColor = 'pink';
    x.style.color = 'red';">Click!</button>

<br><br>
<a href="index.html"><button type="button">Înapoi la exerciții</button></a>

</body>
</html>
