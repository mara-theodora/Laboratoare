<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Paragrafe și buton</title>
</head>
<body>
    <button id="schimba">Schimbă paragrafele</button>

    <p id="p1" style="color: blue; font-weight: bold;">Acesta este primul paragraf.</p>
    <p id="p2" style="color: green; font-style: italic;">Acesta este al doilea paragraf.</p>

    <script>
    var p1 = document.getElementById("p1");
    var p2 = document.getElementById("p2");

    function schimbaText() {
        var text = prompt("Introduceți noul text:", this.innerHTML);
        if (text !== null && text !== "") {
            this.innerHTML = text;
        }
    }

    p1.onclick = schimbaText;
    p2.onclick = schimbaText;

    document.getElementById("schimba").onclick = function () {
        var aux = p1.innerHTML;
        p1.innerHTML = p2.innerHTML;
        p2.innerHTML = aux;
    };
    </script>
</body>
</html>
