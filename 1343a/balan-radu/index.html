    <style>
        ul.meniu {
            list-style-type: none;
            padding: 0;
            margin: 0;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        ul.meniu a {
            display: inline-block;
            text-decoration: none;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-family: sans-serif;
            font-weight: bold;
            transition: opacity 0.2s;
        }
        ul.meniu a:hover{
            color: aqua;
        }

        .b1 {
            background-color: blue;
        }
        .b2 {
            background-color: green;
        }
        .b3 {
            background-color: red;
        }
        .b4 {
            background-color: purple;
        }
    </style>
</head>

    <ul class="meniu">
        <li><a href = "L1/" class="b1">Laboratorul 1</a></li>

    </ul>
