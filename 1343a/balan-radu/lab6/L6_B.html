<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>L6_B – Schimbarea paragrafelor</title>
    <style>
        #p1 {
            color: darkblue;
            background-color: lightyellow;
            font-size: 20px;
            font-family: sans-serif;
            padding: 10px;
        }
        #p2 {
            color: darkred;
            background-color: lavender;
            font-style: italic;
            font-family: serif;
            padding: 10px;
        }
    </style>
</head>
<body>
    <button id="buton">OK</button>

    <p id="p1">Acesta este primul paragraf.</p>
    <p id="p2">Acesta este al doilea paragraf.</p>

    <script>
        var p1 = document.getElementById("p1");
        var p2 = document.getElementById("p2");
        var buton = document.getElementById("buton");

        function schimbaText() {
            var text = prompt("Introduceți noul text:", this.innerHTML);
            if (text !== null && text !== "") {
                this.innerHTML = text;
            }
        }
        p1.onclick = schimbaText;
        p2.onclick = schimbaText;

        buton.onclick = function () {
            var aux = p1.innerHTML;
            p1.innerHTML = p2.innerHTML;
            p2.innerHTML = aux;
        };
    </script>
</body>
</html>
