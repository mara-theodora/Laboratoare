<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>L6_C – Culori cerute prin prompt</title>
</head>
<body>
    <h1 id="titlu">Culori schimbate din JavaScript</h1>

    <p id="par">
        Aceasta este prima linie a paragrafului.<br>
        Aceasta este a doua linie a paragrafului.<br>
        Aceasta este a treia linie a paragrafului.
    </p>

    <script>
        var titlu = document.getElementById("titlu");
        var par = document.getElementById("par");

        function cereCuloare(mesaj) {
            var c = prompt(mesaj, "");
            if (c === null) {
                return null;               // Cancel: nu facem nimic
            }
            if (CSS.supports("color", c)) {
                return c;                  // culoare validă
            }
            alert("Culoarea „" + c + "” nu este corectă!");
            return null;
        }

        titlu.onclick = function () {
            var c = cereCuloare("Introduceți culoarea textului titlului:");
            if (c !== null) {
                this.style.color = c;
            }
        };

        par.onclick = function () {
            var c = cereCuloare("Introduceți culoarea de fundal a paragrafului:");
            if (c !== null) {
                this.style.backgroundColor = c;
            }
        };
    </script>
</body>
</html>
