<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Exercițiu Bonus - Galerie Imagini</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 40px;
        }
        img {
            width: 450px;
            height: 300px;
            object-fit: cover;
            border: 2px solid #ccc;
            border-radius: 8px;
            display: block;
            margin: 20px auto;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            margin: 0 10px;
            cursor: pointer;
        }
        p {
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Galerie Imagini - Bonus</h1>
    
    <img id="galerie-img" src="" alt="Imagine galerie">
    <p id="info-text"></p>
    
    <button id="btnInapoi">Înapoi</button>
    <button id="btnInainte">Înainte</button>

    <script>
        var imagini = [
            "Img/pisici.jpg",
            "Img/caini.jpg",
            "Img/mare.jpg",
            "Img/munti.jpg"
        ];
        
        var indexCurent = 0;

        var imgElement = document.getElementById("galerie-img");
        var textElement = document.getElementById("info-text");
        var btnInapoi = document.getElementById("btnInapoi");
        var btnInainte = document.getElementById("btnInainte");

        function actualizeazaGalerie() {
            imgElement.src = imagini[indexCurent];
            textElement.innerHTML = "Imaginea " + (indexCurent + 1) + " din " + imagini.length;
        }

        actualizeazaGalerie();

        btnInainte.onclick = function() {
            indexCurent = (indexCurent + 1) % imagini.length;
            actualizeazaGalerie();
        };

        btnInapoi.onclick = function() {
            indexCurent = (indexCurent - 1 + imagini.length) % imagini.length;
            actualizeazaGalerie();
        };
    </script>

</body>
</html>
