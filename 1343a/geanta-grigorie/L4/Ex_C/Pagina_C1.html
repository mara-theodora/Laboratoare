<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS_C1</title>
<style>

        #hd {
        font-variant: small-caps;
        color:magenta;
    }
     h1, caption {
        color: blue;
    background-color: #cccc00;
    }
      body {
    background-color: #ffffcc;
    }
.center, p {
  text-align: center;
  color: red;
}

  table {
    border: 2px solid green;
    border-collapse: collapse;
  }

  td {
    text-align: center;
    background-color: orange;
    border: 2px solid green;
  }

  th {
    border: 2px solid green;
  }

  caption {
    color: white;
    background-color: orange;
    font-size: large;
  }

  .margine {
    background-color: magenta;
  }
</style>
</head>
<body>

<h1 id="hd">Tabel special</h1>
<p>Un tabel cu "celule lipite"
</p> 
<table style="width:100%">
<caption>Echipe si hobby-uri</caption>
  <tr>
    <th class="margine">Echipa</th>
	<th class="margine">Nume</th>
    <th colspan="2" class="margine">Pasiuni</th>
  </tr>
  <tr>
	<td rowspan="3" class="margine">Munte</td>
    <td>Popescu</td>
    <td>calatorii</td>
    <td>filatelie</td>
  </tr>
  <tr>
    <td>Ionescu</td>
    <td>planorism</td>
    <td>sah</td>
  </tr>
  <tr>
    <td>Tanase</td>
    <td>ciclism</td>
    <td>citit</td>
  </tr>
  <tr>
	<td rowspan="4" class="margine">Mare</td>
    <td>Georgescu</td>
    <td>plaja</td>
    <td>dans</td>
  </tr>
  <tr>
    <td>Gigescu</td>
    <td>surf</td>
    <td>samba</td>
  </tr>
  <tr>
    <td>Mintescu</td>
    <td>politica</td>
    <td>delicateturi</td>
  </tr>
  <tr>
    <td>Iliescu</td>
    <td>canotaj</td>
    <td>ecologie</td>
  </tr>
</table>
</body>
</html>
